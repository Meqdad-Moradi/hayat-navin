<section class="mx-auto max-w-3xl py-6" aria-labelledby="registration-title">
  <header class="mb-8">
    <p class="mb-2 text-xs font-bold tracking-[1.8px] text-(--primary)">COURSE ENROLLMENT</p>
    <h1
      id="registration-title"
      class="mb-2 text-[clamp(28px,4vw,38px)] leading-tight font-medium tracking-[-1px] text-(--ink)"
    >
      Register a student
    </h1>
    <p class="m-0 text-sm leading-relaxed text-(--text-muted)">
      Enter the student's details and the course they're joining.
    </p>
  </header>

  <div class="rounded-2xl border border-black/8 bg-white p-5 shadow-sm sm:p-8">
    <form class="grid grid-cols-1 gap-x-5 gap-y-2 md:grid-cols-2" [formRoot]="registrationForm">
      <app-custom-form-control
        [field]="registrationForm.studentName"
        label="Student's full name"
        name="studentName"
        (resetInput)="resetInput($event)"
      />

      <app-custom-form-control
        [field]="registrationForm.email"
        label="Email"
        type="email"
        name="email"
        (resetInput)="resetInput($event)"
      />

      <app-custom-form-control
        [field]="registrationForm.phone"
        label="Phone number"
        name="phone"
        (resetInput)="resetInput($event)"
      />

      <app-custom-form-control
        [field]="registrationForm.courseName"
        label="Course name"
        name="courseName"
        (resetInput)="resetInput($event)"
      />

      <div class="flex justify-end pt-2 md:col-span-2">
        <button
          class="min-h-12 w-full rounded-xl sm:w-auto sm:min-w-44"
          type="submit"
          matButton="filled"
        >
          @if (registrationForm().submitting()) {
            <mat-progress-spinner diameter="20" mode="indeterminate" />
            Submitting
          } @else {
            Review registration
          }
        </button>
      </div>
    </form>
  </div>
</section>
