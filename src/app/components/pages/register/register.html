<section class="mx-auto max-w-3xl py-6" aria-labelledby="registration-title">
  <app-page-header
    [eyebrow]="isUpdating() ? 'USER MANAGEMENT' : 'COURSE ENROLLMENT'"
    [title]="isUpdating() ? 'Update user' : 'Register a student'"
    titleId="registration-title"
    [description]="
      isUpdating()
        ? 'Update the current user information!'
        : 'Enter the student\'s details and the course they\'re joining.'
    "
  />

  <div class="rounded-2xl border border-(--surface-border) bg-(--surface) p-5 shadow-sm sm:p-8">
    <form class="grid grid-cols-1 gap-x-5 gap-y-2 md:grid-cols-2" [formRoot]="registrationForm">
      <app-custom-form-control
        [field]="registrationForm.studentName"
        label="Student's full name"
        name="studentName"
      />

      <app-custom-form-control
        [field]="registrationForm.email"
        label="Email"
        type="email"
        name="email"
      />

      <app-custom-form-control [field]="registrationForm.phone" label="Phone number" name="phone" />

      <app-custom-form-control
        [field]="registrationForm.courseName"
        label="Course name"
        name="courseName"
      />

      <div class="flex justify-end pt-2 md:col-span-2">
        <button
          class="w-full rounded-xl sm:w-auto sm:min-w-44"
          type="submit"
          matButton="filled"
          [mat-dialog-close]
        >
          @if (registrationForm().submitting()) {
            <mat-progress-spinner diameter="20" mode="indeterminate" />
            {{ isUpdating() ? 'Updating' : 'Submitting' }}
          } @else {
            {{ this.isUpdating() ? 'Update User' : 'Review registration' }}
          }
        </button>
      </div>
    </form>
  </div>
</section>
