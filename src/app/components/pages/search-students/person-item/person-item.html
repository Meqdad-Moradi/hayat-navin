<div
  class="grid grid-cols-[1.2fr_1fr_1.5fr_auto_auto] items-center transition-colors hover:bg-(--primary)/5"
  role="row"
>
  <span class="px-5 py-4 font-medium text-(--ink)" role="cell">
    {{ person().firstName }} {{ person().lastName }}
  </span>
  <span class="px-5 py-4 text-(--text-muted)" role="cell">@{{ person().username }}</span>
  <span class="px-5 py-4 text-(--ink)" role="cell">{{ person().email }}</span>
  <span class="px-5 py-4" role="cell">
    <span
      class="inline-flex rounded-full px-2.5 py-1 text-xs font-medium"
      [class]="person().isActive ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'"
    >
      {{ person().isActive ? 'Active' : 'Inactive' }}
    </span>
  </span>

  <button matIconButton [matMenuTriggerFor]="menu">
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #menu="matMenu" xPosition="before">
    <button mat-menu-item>
      Edit User
      <mat-icon>edit</mat-icon>
    </button>
  </mat-menu>
</div>
