<div
  class="flex min-w-0 items-center gap-4 mx-2 py-2 pl-2 transition-colors hover:bg-(--surface-hover) border-b border-b-(--surface-border)"
>
  <div
    class="flex size-11 shrink-0 items-center justify-center rounded-full bg-(--primary)/10 text-sm font-semibold text-(--primary)"
    aria-hidden="true"
  >
    {{ user().name.charAt(0) }}{{ user().name.charAt(1) }}
  </div>

  <div class="min-w-0 flex-1">
    <div class="flex flex-wrap items-baseline gap-x-2 gap-y-0.5">
      <h2 class="m-0 truncate text-sm font-semibold text-(--ink)">{{ user().name }}</h2>
      <span class="truncate text-xs text-(--text-muted)">@{{ user().username }}</span>
    </div>
    <div
      class="mt-1 flex flex-col gap-x-5 gap-y-1 text-xs text-(--text-muted) sm:flex-row sm:flex-wrap"
    >
      <span class="flex min-w-0 items-center gap-1.5">
        <mat-icon class="size-4! text-base! grid! content-center!" aria-hidden="true"
          >mail</mat-icon
        >
        <span class="truncate">{{ user().email }}</span>
      </span>
      <span class="flex items-center gap-1.5">
        <mat-icon class="!size-4 !text-base grid! content-center!" aria-hidden="true"
          >apartment</mat-icon
        >
        <span class="truncate">{{ user().company.name }}</span>
      </span>
    </div>
  </div>

  <button
    matIconButton
    type="button"
    [matMenuTriggerFor]="userMenu"
    [attr.aria-label]="'More actions for ' + user().name"
  >
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu" xPosition="before">
    <button mat-menu-item type="button" (click)="onEditUser()">
      <mat-icon>edit</mat-icon>
      <span>Edit user</span>
    </button>
  </mat-menu>
</div>
