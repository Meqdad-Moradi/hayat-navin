<mat-form-field class="w-full" appearance="outline">
  <mat-label>{{ label() }}</mat-label>

  <input
    #inputElement
    matInput
    [type]="currentType()"
    [value]="value()"
    (input)="value.set($any($event.target).value)"
    [required]="required()"
    [disabled]="disabled()"
    (blur)="touch.emit()"
  />

  @if (value()) {
    <button
      type="button"
      mat-icon-button
      matSuffix
      tabIndex="-1"
      [disabled]="disabled()"
      (click)="resetInput()"
    >
      <mat-icon>close</mat-icon>
    </button>
  }

  @if (inputType() === 'password') {
    <button
      type="button"
      mat-icon-button
      matSuffix
      tabIndex="-1"
      [matTooltip]="currentType() === 'password' ? 'Show password' : 'Hide password'"
      [disabled]="disabled()"
      (click)="togglePasswordType()"
    >
      <mat-icon>{{ passwordVisibilityIcon() }}</mat-icon>
    </button>
  }

  @if (showErrors()) {
    <mat-error>{{ errors()[0]?.message }}</mat-error>
  }
</mat-form-field>
